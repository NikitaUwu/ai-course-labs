# docker-compose.yml
# Конфигурация для развёртывания n8n
# version: '3.8'
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n_workflow
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        n8n import:workflow --separate --input=/home/node/workflows
        n8n publish:workflow --id=week4-basic-application
        n8n publish:workflow --id=week4-graph-digitization-analysis
        n8n start
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Europe/Moscow}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-this-key}
      # Yandex Cloud credentials
      - YANDEX_IAM_TOKEN=${YANDEX_IAM_TOKEN}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
      # Telegram bot credentials
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TG_CHAT_ID=${TG_CHAT_ID}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../workflows:/home/node/workflows
    networks:
      - n8n_network
  
  postgres:
    image: postgres:15-alpine
    container_name: n8n_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-n8n}
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  n8n_data:
    driver: local
  postgres_data:
    driver: local

networks:
  n8n_network:
    driver: bridge
